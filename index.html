<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CRUD Produtos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Cadastro de Produtos</h1>

    <div class="container">
      <form id="form">
        <input id="nome" placeholder="Nome" />
        <input id="categoria" placeholder="Categoria" />

        <input id="preco" type="number" step="0.01" placeholder="Preço" />
        <input id="estoque" type="number" step="1" placeholder="Estoque" />

        <input id="descricao" placeholder="Descrição" />
        <input id="imagem" placeholder="URL da Imagem" />

        <div class="buttons">
          <button type="submit" id="btnSalvar">Salvar</button>
          <button type="button" id="btnCancelar" style="display: none">
            Cancelar
          </button>
        </div>
      </form>

      <table>
        <thead>
          <tr>
            <th>Imagem</th>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Preço</th>
            <th>Estoque</th>
            <th>Descrição</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela"></tbody>
      </table>
    </div>

    <script src="script.js"></script>
  </body>
</html>
